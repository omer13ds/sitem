<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THREE | The Hierarchy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="overlay"></div>

<nav class="navbar navbar-expand-lg navbar-dark p-4 fixed-top">
    <div class="container-fluid px-md-5">
        <a class="navbar-brand" href="#">T H R E E <span class="neon-dot">.</span></a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link active" href="#" onclick="showSection('public-view')">ANA SAYFA</a></li>
                <li class="nav-item"><a class="nav-link" href="#">ROL SS</a></li>
                <li class="nav-item"><a class="nav-link" href="#">HİKAYEMİZ</a></li>
                <li class="nav-item d-none" id="nav-dashboard"><a class="nav-link text-warning" href="#" onclick="showSection('dashboard-view')">EKİP PANELİ</a></li>
            </ul>
            <div class="d-flex align-items-center" id="auth-buttons">
                <button class="btn btn-three me-2" data-bs-toggle="modal" data-bs-target="#loginModal">GİRİŞ</button>
                <button class="btn btn-outline-light rounded-0" data-bs-toggle="modal" data-bs-target="#registerModal">KAYIT</button>
            </div>
        </div>
    </div>
</nav>

<div class="container" style="margin-top: 150px;">
    
    <div id="public-view" class="view-section text-center">
        <div class="hero-content">
            <h1 class="brand-title">THREE</h1>
            <p class="brand-subtitle">GÜNDÜZ PARTİ, GECE HİYERARŞİ.</p>
            <div class="mt-5">
                <button class="btn btn-three btn-lg px-5">BİZE KATIL</button>
            </div>
        </div>
    </div>

    <div id="dashboard-view" class="view-section" style="display: none;">
        <div class="row mb-5">
            <div class="col-md-8">
                <h2 class="fw-bold text-white">İÇ DAİRE <span class="text-danger">///</span></h2>
                <p class="text-muted" id="user-role-text">Rol: Kontrol Ediliyor...</p>
            </div>
            <div class="col-md-4 text-md-end">
                <h3 class="text-success mb-0">$2,450,000</h3>
                <small class="text-muted">EKİP KASASI</small>
            </div>
        </div>

        <div class="glass-panel">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="text-uppercase fw-bold m-0" style="letter-spacing: 2px;">HAFTALIK ÖDEME LİSTESİ</h5>
                <div id="admin-controls" style="display: none;">
                    <button class="btn btn-danger btn-sm rounded-0">KASAYI SIFIRLA</button>
                </div>
            </div>
            
            <div class="table-responsive">
                <table class="table table-glass">
                    <thead>
                        <tr>
                            <th>ÜYE</th>
                            <th>RÜTBE</th>
                            <th>AİDAT</th>
                            <th>DURUM</th>
                        </tr>
                    </thead>
                    <tbody id="payment-table-body">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-panel p-4">
            <h4 class="text-center text-white mb-4">GİRİŞ YAP</h4>
            <input type="email" id="login-email" class="form-control mb-3" placeholder="E-posta">
            <input type="password" id="login-pass" class="form-control mb-4" placeholder="Şifre">
            <button class="btn btn-three w-100 py-3" onclick="handleLogin()">SİSTEME GİR</button>
        </div>
    </div>
</div>

<div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-panel p-4">
            <h4 class="text-center text-white mb-4">EKİBE KAYDOL</h4>
            <input type="text" id="reg-user" class="form-control mb-3" placeholder="Kullanıcı Adı">
            <input type="email" id="reg-email" class="form-control mb-3" placeholder="E-posta">
            <input type="password" id="reg-pass" class="form-control mb-4" placeholder="Şifre">
            <button class="btn btn-three w-100 py-3" onclick="handleRegister()">KAYIT OL</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const supabaseUrl = 'https://bfalmjjzovgeuzwyqdwa.supabase.co';
    const supabaseKey = 'sb_publishable_2jvOJu9Fl07k_wYNoV_wgw_PK365JZo';
    const db = supabase.createClient(supabaseUrl, supabaseKey);

    // KULLANICI KONTROLÜ
    async function checkSession() {
        const { data: { user } } = await db.auth.getUser();
        const authBtnArea = document.getElementById('auth-buttons');
        const dashNav = document.getElementById('nav-dashboard');

        if (user) {
            // Profil bilgisini çek (Rolü görmek için)
            const { data: profile } = await db.from('profiles').select('*').eq('id', user.id).single();
            
            authBtnArea.innerHTML = `<span class="text-white me-3 small">${profile.username}</span><button class="btn btn-sm btn-outline-danger" onclick="handleLogout()">ÇIKIŞ</button>`;
            
            // Eğer rol 'Ekip Üyesi' veya 'Admin' ise paneli göster
            if (profile.role === 'Admin' || profile.role === 'Ekip Üyesi') {
                dashNav.classList.remove('d-none');
                document.getElementById('user-role-text').innerText = `Yetki: ${profile.role}`;
                if (profile.role === 'Admin') document.getElementById('admin-controls').style.display = 'block';
            }
        } else {
            authBtnArea.innerHTML = `<button class="btn btn-three me-2" data-bs-toggle="modal" data-bs-target="#loginModal">GİRİŞ</button><button class="btn btn-outline-light rounded-0" data-bs-toggle="modal" data-bs-target="#registerModal">KAYIT</button>`;
            dashNav.classList.add('d-none');
            showSection('public-view');
        }
    }

    // KAYIT FONKSİYONU
    async function handleRegister() {
        const email = document.getElementById('reg-email').value;
        const pass = document.getElementById('reg-pass').value;
        const user = document.getElementById('reg-user').value;

        const { data, error } = await db.auth.signUp({ email, password: pass });
        
        if (error) alert(error.message);
        else {
            // Profil oluştur (Ömer'in kullanıcı adını otomatik admin yapıyoruz)
            let role = (user === 'omer13ds') ? 'Admin' : 'Ziyaretçi';
            await db.from('profiles').insert([{ id: data.user.id, username: user, role: role }]);
            alert("Kayıt başarılı! Giriş yapabilirsin.");
            location.reload();
        }
    }

    // GİRİŞ FONKSİYONU
    async function handleLogin() {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;
        const { error } = await db.auth.signInWithPassword({ email, password: pass });
        if (error) alert("Hata: " + error.message);
        else location.reload();
    }

    async function handleLogout() {
        await db.auth.signOut();
        location.reload();
    }

    function showSection(id) {
        document.querySelectorAll('.view-section').forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = 'block';
        if(id === 'dashboard-view') fetchPayments();
    }

    async function fetchPayments() {
        const { data } = await db.from('crew_payments').select('*');
        const tbody = document.getElementById('payment-table-body');
        tbody.innerHTML = data.map(p => `
            <tr>
                <td>${p.member_name}</td>
                <td>${p.rank}</td>
                <td>${p.amount}</td>
                <td class="${p.status === 'Ödendi' ? 'text-success' : 'text-danger'}">${p.status}</td>
            </tr>
        `).join('');
    }

    window.onload = checkSession;
</script>
</body>
</html>
