<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetim Portalı | Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        /* Genel Değişkenler ve Ayarlar */
        :root {
            --neon-red: #ff003c;
            --glass-bg: rgba(15, 15, 15, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            background-color: #0a0a0a;
            /* Arkaplan Fotoğrafı ve Üzerine Karanlık Filtre */
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), url('https://images.unsplash.com/photo-1605810230434-7631ac76ec81?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ------------------ NAVBAR ------------------ */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: white;
            text-decoration: none;
        }

        .logo span {
            color: var(--neon-red);
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: #aaa;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: white;
        }

        /* ------------------ GİRİŞ BÖLÜMÜ ------------------ */
        .auth-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-glass {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 10px 15px;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            outline: none;
            transition: 0.3s;
        }

        .input-glass:focus {
            border-color: var(--neon-red);
            box-shadow: 0 0 8px rgba(255, 0, 60, 0.3);
        }

        .btn-neon {
            background: white;
            color: black;
            border: none;
            padding: 10px 20px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-neon:hover {
            background: var(--neon-red);
            color: white;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.4);
        }

        /* ------------------ PROFİL BARI (Gizli) ------------------ */
        .profile-bar {
            display: none; /* Başlangıçta gizli */
            align-items: center;
            gap: 15px;
        }

        .user-badge {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 5px 15px 5px 5px;
            gap: 10px;
            backdrop-filter: blur(10px);
        }

        .avatar {
            width: 35px;
            height: 35px;
            background: var(--neon-red);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .username-text {
            font-weight: 600;
            color: white;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .btn-logout {
            background: transparent;
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
            padding: 8px 15px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: var(--neon-red);
            color: white;
        }

        /* ------------------ ANA VİTRİN ------------------ */
        .hero-section {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: 15px;
            color: white;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
            margin-bottom: 10px;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            letter-spacing: 5px;
            color: #aaa;
        }

        /* ------------------ ADMİN PANELİ (Gizli) ------------------ */
        .admin-dashboard {
            display: none; /* Başlangıçta gizli */
            max-width: 1200px;
            margin: -50px auto 50px auto;
            position: relative;
            z-index: 10;
            padding: 0 20px;
        }

        .dashboard-header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 25px 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            border-left: 4px solid var(--neon-red);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .dashboard-header h2 {
            font-family: 'Montserrat', sans-serif;
            color: white;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .dashboard-header p {
            color: #888;
            font-size: 0.9rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            padding: 40px 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .glass-card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(25, 25, 25, 0.8);
            box-shadow: 0 15px 40px rgba(255, 0, 60, 0.15);
        }

        .card-icon {
            font-size: 2.5rem;
            color: white;
            margin-bottom: 15px;
            display: block;
        }

        .card-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: white;
            letter-spacing: 1px;
            font-size: 1rem;
        }

    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">SİSTEM<span>.</span></a>
        
        <div class="nav-links">
            <a href="#">ANA SAYFA</a>
            <a href="#">BİZ KİMİZ?</a>
            <a href="#">GALERİ</a>
        </div>

        <div class="auth-area" id="login-form">
            <input type="text" id="username" class="input-glass" placeholder="Kullanıcı Adı">
            <input type="password" id="password" class="input-glass" placeholder="Şifre">
            <button class="btn-neon" onclick="girisYap()">GİRİŞ</button>
        </div>

        <div class="profile-bar" id="profile-area">
            <div class="user-badge">
                <div class="avatar">Ö</div>
                <span class="username-text">ÖMER</span>
            </div>
            <button class="btn-logout" onclick="cikisYap()">ÇIKIŞ</button>
        </div>
    </nav>

    <header class="hero-section">
        <h1 class="hero-title">KONTROL</h1>
        <p class="hero-subtitle">GİZLİLİK. GÜVEN. DİSİPLİN.</p>
    </header>

    <section class="admin-dashboard" id="admin-panel">
        <div class="dashboard-header">
            <h2>ADMİN PANELİ</h2>
            <p>Sisteme yetkili olarak bağlandınız. Aşağıdan işlemleri yürütebilirsiniz.</p>
        </div>

        <div class="grid-container">
            <div class="glass-card">
                <span class="card-icon">👥</span>
                <span class="card-title">EKİBİ YÖNET</span>
            </div>
            <div class="glass-card" style="border-bottom: 3px solid #00ff88;">
                <span class="card-icon">💰</span>
                <span class="card-title">KASA İŞLEMLERİ</span>
            </div>
            <div class="glass-card" style="border-bottom: 3px solid #ffcc00;">
                <span class="card-icon">📸</span>
                <span class="card-title">ARŞİV & GALERİ</span>
            </div>
            <div class="glass-card" style="border-bottom: 3px solid var(--neon-red);">
                <span class="card-icon">⚙️</span>
                <span class="card-title">SİSTEM AYARLARI</span>
            </div>
        </div>
    </section>

    <script>
        // Şifre alanındayken Enter'a basınca direkt giriş yapması için
        document.getElementById("password").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                girisYap();
            }
        });

        function girisYap() {
            var kadi = document.getElementById('username').value;
            var sifre = document.getElementById('password').value;

            // Senin özel bilgilerin
            if (kadi === "omer13ds" && sifre === "oyaali12") {
                // Giriş kısmını gizle, profili ve paneli göster
                document.getElementById('login-form').style.display = "none";
                document.getElementById('profile-area').style.display = "flex";
                document.getElementById('admin-panel').style.display = "block";
            } else {
                // Şifre yanlışsa uyarı ver
                alert("Hatalı kullanıcı adı veya şifre girdin kanka, tekrar dene!");
            }
        }

        function cikisYap() {
            // Çıkış yapınca her şeyi eski haline çevir
            document.getElementById('username').value = "";
            document.getElementById('password').value = "";
            
            document.getElementById('login-form').style.display = "flex";
            document.getElementById('profile-area').style.display = "none";
            document.getElementById('admin-panel').style.display = "none";
        }
    </script>
</body>
</html>
