<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensiSoftware | Siber Güvenlik</title>
    <style>
        /* Genel Ayarlar */
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0c10; /* Koyu siber arka plan */
            color: #c5c6c7;
            height: 100%;
            scroll-behavior: smooth;
        }

        /* Navigasyon Çubuğu */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: rgba(11, 12, 16, 0.95);
            border-bottom: 1px solid #1f2833;
            position: fixed;
            width: 100%;
            top: 0;
            box-sizing: border-box;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #66fcf1; /* Neon siber vurgu */
            text-decoration: none;
            letter-spacing: 2px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 30px;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: #c5c6c7;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #45a29e;
        }

        /* Ana İçerik (Hero Section) */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at center, #1f2833 0%, #0b0c10 70%);
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 3rem;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .hero h1 span {
            color: #66fcf1;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* İndirme Butonu */
        .download-btn {
            background-color: transparent;
            color: #66fcf1;
            border: 2px solid #66fcf1;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.1);
        }

        .download-btn:hover {
            background-color: #66fcf1;
            color: #0b0c10;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.6);
        }
    </style>
</head>
<body>

    <!-- Üst Menü -->
    <nav>
        <a href="#" class="logo">SensiSoftware</a>
        <ul class="nav-links">
            <li><a href="#ana-sayfa">Ana Sayfa</a></li>
            <li><a href="#hizmetler">Hizmetler</a></li>
            <li><a href="#indir">İndir</a></li>
        </ul>
    </nav>

    <!-- Ana Ekran -->
    <section class="hero" id="ana-sayfa">
        <h1>Gelişmiş <span>Siber Güvenlik</span> Mimarisi</h1>
        <p>Sistemlerinizi güvende tutmak için ihtiyacınız olan tüm altyapı tek bir platformda. Hızlı, güvenilir ve sade.</p>
        <a href="#indir" class="download-btn">SensiSoftware Launcher İndir</a>
    </section>

</body>
</html>
