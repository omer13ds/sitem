<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensi Software | Developer Forum</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-glow: #007bff;
            --dark-bg: #0d0d0d;
            --card-bg: #161616;
            --border-color: #2a2a2a;
            --text-gray: #a0a0a0;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Neon Navbar */
        .navbar-sensi {
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 1px solid var(--primary-glow);
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.2);
        }

        .navbar-brand {
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Forum Cards */
        .forum-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .forum-card:hover {
            border-color: var(--primary-glow);
            box-shadow: 0 0 20px rgba(0, 123, 255, 0.1);
            transform: scale(1.01);
        }

        .category-tag {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(0, 123, 255, 0.1);
            color: var(--primary-glow);
            border: 1px solid var(--primary-glow);
            text-transform: uppercase;
        }

        .stat-icon { color: var(--text-gray); font-size: 0.9rem; }
        
        /* Sidebar */
        .sidebar-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .btn-sensi {
            background: var(--primary-glow);
            color: white;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            transition: 0.3s;
        }

        .btn-sensi:hover {
            box-shadow: 0 0 20px var(--primary-glow);
            opacity: 0.9;
        }

        a { text-decoration: none; color: inherit; }
        
        .loading-text {
            color: var(--text-gray);
            font-style: italic;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-sensi py-3">
    <div class="container">
        <a class="navbar-brand" href="#">SENSI <span class="text-primary">SOFTWARE</span></a>
        
        <div class="d-flex align-items-center" id="auth-section">
            <div class="spinner-border text-primary spinner-border-sm" role="status">
                <span class="visually-hidden">Yükleniyor...</span>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold">Akış</h3>
                <div class="dropdown">
                    <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button">En Yeni</button>
                </div>
            </div>

            <div id="forum-posts-container">
                <div class="loading-text">
                    <i class="fas fa-spinner fa-spin me-2"></i> Veritabanından konular çekiliyor...
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <button class="btn btn-sensi w-100 mb-4 py-3" onclick="alert('Yakında burayı da aktifleştireceğiz kanka!')">
                <i class="fas fa-plus me-2"></i>Yeni Konu Oluştur
            </button>
            
            <div class="sidebar-box mb-4">
                <h6 class="text-primary fw-bold mb-3 uppercase">Popüler Kategoriler</h6>
                <div class="list-group list-group-flush">
                    <a href="#" class="list-group-item bg-transparent text-light border-secondary px-0"># Csharp / .NET</a>
                    <a href="#" class="list-group-item bg-transparent text-light border-secondary px-0"># Python Scripts</a>
                    <a href="#" class="list-group-item bg-transparent text-light border-secondary px-0"># Game Hacking</a>
                    <a href="#" class="list-group-item bg-transparent text-light border-secondary px-0"># YouTube Automation</a>
                </div>
            </div>

            <div class="sidebar-box">
                <h6 class="text-primary fw-bold mb-3 uppercase">Forum İstatistikleri</h6>
                <div class="d-flex justify-content-between small mb-2">
                    <span>Toplam Üye:</span>
                    <span class="text-light">1,245</span>
                </div>
                <div class="d-flex justify-content-between small mb-2">
                    <span>Çevrimiçi:</span>
                    <span class="text-success">84</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-dark text-light" style="border: 1px solid var(--primary-glow);">
      <div class="modal-header border-secondary">
        <h5 class="modal-title fw-bold">Sensi Forum'a Katıl</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <div class="mb-3">
          <label class="form-label text-muted small">E-posta Adresi</label>
          <input type="email" id="email-input" class="form-control bg-dark text-light border-secondary" placeholder="ornek@mail.com">
        </div>
        <div class="mb-4">
          <label class="form-label text-muted small">Şifre</label>
          <input type="password" id="password-input" class="form-control bg-dark text-light border-secondary" placeholder="******">
        </div>
        <div id="auth-message" class="text-center small mb-3 fw-bold"></div>
        <div class="d-grid gap-2">
          <button type="button" class="btn btn-sensi" id="btn-login">Giriş Yap</button>
          <button type="button" class="btn btn-outline-secondary" id="btn-register">Yeni Kayıt Ol</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // 1. Supabase Bağlantısı
    const supabaseUrl = 'https://bfalmjjzovgeuzwyqdwa.supabase.co';
    const supabaseKey = 'sb_publishable_2jvOJu9Fl07k_wYNoV_wgw_PK365JZo';
    const db = supabase.createClient(supabaseUrl, supabaseKey);

    // 2. HTML Elementlerini Tanımlama
    const authSection = document.getElementById('auth-section');
    const authMessage = document.getElementById('auth-message');
    const emailInput = document.getElementById('email-input');
    const passwordInput = document.getElementById('password-input');

    // 3. Kullanıcı Oturum Kontrolü
    async function checkUser() {
        const { data: { user } } = await db.auth.getUser();
        
        if (user) {
            // Kullanıcı giriş yapmış
            let username = user.email.split('@')[0];
            authSection.innerHTML = `
                <span class="text-muted me-3 d-none d-md-inline">Hoş geldin, <strong class="text-white">${username}</strong></span>
                <img src="https://ui-avatars.com/api/?name=${username}&background=0D8ABC&color=fff" class="rounded-circle me-3" width="35" alt="Profile">
                <button class="btn btn-sm btn-outline-danger" onclick="logout()">Çıkış Yap</button>
            `;
        } else {
            // Kullanıcı giriş yapmamış
            authSection.innerHTML = `
                <button class="btn btn-sensi btn-sm px-4" data-bs-toggle="modal" data-bs-target="#authModal">Giriş Yap</button>
            `;
        }
    }

    // 4. Konuları Çekme (Forum Akışı)
    async function fetchPosts() {
        const container = document.getElementById('forum-posts-container');
        
        try {
            const { data, error } = await db
                .from('posts')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;

            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<div class="loading-text">Henüz hiç konu açılmamış. İlk konuyu sen aç!</div>';
                return;
            }

            data.forEach(post => {
                let tagColor = 'var(--primary-glow)';
                let tagBg = 'rgba(0, 123, 255, 0.1)';
                
                if(post.category.toLowerCase().includes('python')) {
                    tagColor = '#28a745'; 
                    tagBg = 'rgba(40,167,69,0.1)';
                } else if (post.category.toLowerCase().includes('ui') || post.category.toLowerCase().includes('wpf')) {
                    tagColor = '#ffc107'; 
                    tagBg = 'rgba(255,193,7,0.1)';
                }

                container.innerHTML += `
                    <div class="forum-card d-flex align-items-center justify-content-between">
                        <div>
                            <span class="category-tag mb-2 d-inline-block" style="border-color: ${tagColor}; color: ${tagColor}; background: ${tagBg};">
                                ${post.category}
                            </span>
                            <h5 class="fw-bold mb-1">${post.title}</h5>
                            <p class="text-muted small mb-0">${post.author} tarafından paylaşıldı</p>
                        </div>
                        <div class="text-end d-none d-md-block">
                            <div class="stat-icon"><i class="far fa-comment-alt"></i> ${post.comments_count || 0}</div>
                            <div class="stat-icon mt-1"><i class="far fa-eye"></i> ${post.views || 0}</div>
                        </div>
                    </div>
                `;
            });

        } catch (error) {
            console.error('Veri çekilirken hata oluştu:', error.message);
            container.innerHTML = '<div class="loading-text text-danger">Konular yüklenirken bir hata oluştu!</div>';
        }
    }

    // 5. Kayıt Ol İşlemi
    document.getElementById('btn-register').addEventListener('click', async () => {
        authMessage.innerText = "Kayıt yapılıyor...";
        authMessage.className = "text-warning small mb-3 fw-bold";
        
        const { data, error } = await db.auth.signUp({
            email: emailInput.value,
            password: passwordInput.value,
        });

        if (error) {
            authMessage.innerText = "Hata: " + error.message;
            authMessage.className = "text-danger small mb-3 fw-bold";
        } else {
            authMessage.innerText = "Kayıt başarılı! Şimdi giriş yapabilirsin.";
            authMessage.className = "text-success small mb-3 fw-bold";
        }
    });

    // 6. Giriş Yap İşlemi
    document.getElementById('btn-login').addEventListener('click', async () => {
        authMessage.innerText = "Giriş yapılıyor...";
        authMessage.className = "text-warning small mb-3 fw-bold";

        const { data, error } = await db.auth.signInWithPassword({
            email: emailInput.value,
            password: passwordInput.value,
        });

        if (error) {
            authMessage.innerText = "Giriş başarısız. Şifreyi kontrol et.";
            authMessage.className = "text-danger small mb-3 fw-bold";
        } else {
            // Başarılı girişte modalı kapat ve ekranı güncelle
            var authModalElement = document.getElementById('authModal');
            var modal = bootstrap.Modal.getInstance(authModalElement) || new bootstrap.Modal(authModalElement);
            modal.hide();
            
            // Inputları temizle
            emailInput.value = '';
            passwordInput.value = '';
            authMessage.innerText = '';
            
            checkUser();
        }
    });

    // 7. Çıkış Yap İşlemi
    async function logout() {
        await db.auth.signOut();
        checkUser();
    }

    // 8. Sistemi Başlat
    window.onload = () => {
        checkUser();
        fetchPosts();
    };
</script>

</body>
</html>
